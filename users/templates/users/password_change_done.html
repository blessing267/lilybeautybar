{% extends "shop/base.html" %}

{% block title %}
    Password Updated | Lily Beauty Bar
{% endblock %}

{% block content %}

<section
    class="grid min-h-[65vh]
           place-items-center
           bg-gradient-to-br
           from-white via-pink-50 to-white
           px-4 py-12"
>
    <div
        class="w-full max-w-md
               rounded-2xl
               border border-pink-100
               bg-white
               p-8 text-center
               shadow-sm"
    >

        <div
            class="mx-auto grid h-16 w-16
                   place-items-center
                   rounded-full
                   bg-green-100
                   text-green-600"
        >
            <svg
                class="h-8 w-8"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="m5 12 4 4L19 6"
                />
            </svg>
        </div>

        <h1 class="mt-5 text-2xl font-bold text-gray-950">
            Password updated
        </h1>

        <p class="mt-2 text-sm text-gray-600">
            Your account password has been changed successfully!
        </p>

        <a
            href="{% url 'profile' %}"
            class="mt-6 inline-flex
                   rounded-xl
                   bg-pink-500
                   px-6 py-3
                   text-sm font-bold
                   text-white
                   transition
                   hover:bg-pink-600"
        >
            Return to Profile
        </a>

    </div>
</section>

{% endblock %}
